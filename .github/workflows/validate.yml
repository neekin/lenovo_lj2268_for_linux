name: Linux driver validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies and native driver
        run: sudo bash install.sh
      - name: Check scripts and Python syntax
        run: |
          bash -n install.sh install-prebuilt-c.sh build-native.sh build-c.sh configure-printer.sh tools/build-deb.sh tests/cups-smoke.sh
          python3 -m py_compile rastertolkpl tests/selftest.py tests/compare_drivers.py tests/python_reference.py tests/test_horizontal_calibration.py tools/generate_c_tables.py
      - name: Verify staged installation and native ABI
        run: |
          bash install.sh --no-deps --stage build/stage
          python3 tests/selftest.py --library build/stage/libjbigwrap.so --filter build/stage/rastertolkpl | tee build/validation-${{ matrix.arch }}.json
      - name: CUPS PDF conversion and queue setup
        run: bash tests/cups-smoke.sh
      - name: Verify matching prebuilt library installation
        run: sudo bash install.sh --no-deps --prebuilt
      - name: Build native C raster driver
        run: bash build-c.sh
      - name: Full byte parity and same-raster speed comparison
        run: |
          python3 tests/compare_drivers.py --native build/rastertolkpl-c \
            --library build/stage/libjbigwrap.so --raster build/cups-smoke.raster \
            --benchmark --report build/c-parity-${{ matrix.arch }}.json
      - name: Install C variant and check real CUPS raster conversion
        run: |
          sudo bash install.sh --no-deps --driver c
          LHPL_SMOKE_FILTER=/usr/lib/cups/filter/rastertolkpl bash tests/cups-smoke.sh
      - name: Verify horizontal pixel calibration independently
        run: |
          python3 tests/test_horizontal_calibration.py --native build/rastertolkpl-c \
            --raster build/cups-smoke.raster --real-shift-dots -12 \
            --report build/c-calibration-${{ matrix.arch }}.json
      - name: Install released precompiled C driver
        run: |
          sudo bash install-prebuilt-c.sh --no-deps
          LHPL_SMOKE_FILTER=/usr/lib/cups/filter/rastertolkpl bash tests/cups-smoke.sh
      - name: Build and install native Debian package
        run: |
          bash tools/build-deb.sh
          sudo apt-get install -y ./build/packages/*.deb
          LHPL_SMOKE_FILTER=/usr/lib/cups/filter/rastertolkpl bash tests/cups-smoke.sh
          sudo lpinfo -m | grep 'Lenovo LJ2268'
          python3 tests/test_horizontal_calibration.py --native /usr/lib/cups/filter/rastertolkpl \
            --raster build/cups-smoke.raster --real-shift-dots -12 --real-only \
            --report build/c-package-calibration-${{ matrix.arch }}.json
      - name: Address and undefined behavior sanitizers
        env:
          # Failed-input cases deliberately exit; check bounds/UB, not process-exit allocations.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isource/jbigkit source/rastertolkpl.c source/jbigkit/jbig.c source/jbigkit/jbig_ar.c \
            -o build/rastertolkpl-c-asan
          python3 tests/compare_drivers.py --native build/rastertolkpl-c-asan \
            --library build/stage/libjbigwrap.so --report build/c-sanitizer-${{ matrix.arch }}.json
          python3 tests/test_horizontal_calibration.py --native build/rastertolkpl-c-asan \
            --baseline build/rastertolkpl-c --report build/c-calibration-sanitizer-${{ matrix.arch }}.json
      - name: Build the documented Docker image
        run: |
          docker build -t lj2268-cups:ci .
          docker run --rm --network none --entrypoint python3 lj2268-cups:ci -c 'import ctypes; ctypes.CDLL("/usr/local/lib/libjbigwrap.so")'
      - name: Build and execute C Docker variant
        run: |
          docker build --build-arg DRIVER=c -t lj2268-cups:c-ci .
          docker run --rm --network none -e LHPL_X_SHIFT_DOTS=-12 --mount type=bind,src="$PWD/build",dst=/inputs,readonly \
            --entrypoint /bin/bash lj2268-cups:c-ci -ec \
            '/usr/lib/cups/filter/rastertolkpl 1 ci "C Docker test" 1 "" /inputs/cups-smoke.raster > /tmp/output.prn 2> /tmp/filter.log; test -s /tmp/output.prn; grep -q "calibration: -12 dots" /tmp/filter.log'
      - name: Build and execute Docker using precompiled package
        run: |
          mkdir -p packages
          cp build/packages/*.deb packages/
          docker build -f Dockerfile.prebuilt -t lj2268-cups:prebuilt-ci .
          docker run --rm --network none -e LHPL_X_SHIFT_DOTS=-12 --mount type=bind,src="$PWD/build",dst=/inputs,readonly \
            --entrypoint /bin/bash lj2268-cups:prebuilt-ci -ec \
            '/usr/lib/cups/filter/rastertolkpl 1 ci "Precompiled Docker test" 1 "" /inputs/cups-smoke.raster > /tmp/output.prn 2> /tmp/filter.log; test -s /tmp/output.prn; grep -q "calibration: -12 dots" /tmp/filter.log'
      - name: Upload native build and validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lj2268-${{ matrix.arch }}
          path: |
            build/stage/
            build/validation-*.json
            build/cups-raster.log
            build/rastertolkpl-c
            build/c-parity-*.json
            build/c-sanitizer-*.json
            build/c-calibration-*.json
            build/c-package-calibration-*.json
            build/packages/*.deb
          if-no-files-found: warn
